name: Build nxnative IPA

on:
  workflow_dispatch:
    inputs:
      game_archive_sha256:
        description: SHA-256 checksum of that ZIP
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
  HOMEBREW_NO_AUTO_UPDATE: 1

jobs:
  build-ipa:
    name: Build unsigned IPA
    if: github.ref == 'refs/heads/main'
    runs-on: xcode-27
    timeout-minutes: 120

    steps:
      - name: Require a private repository
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [[ "$REPOSITORY_PRIVATE" != "true" ]]; then
            echo "::error::This workflow packages game files into the IPA and must run from a private repository."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: .github/workflows/build-nxnative.yml

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Download Xcode Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Install system dependencies
        run: brew install xcodegen zstd glslang

      - name: Install Python dependencies
        run: python -m pip install lz4 "capstone>=5,<6" fonttools nsz zbic

      - name: Download and verify game archive
        env:
          GAME_ARCHIVE_URL: ${{ secrets.GAME_ARCHIVE_URL }}
          GAME_ARCHIVE_SHA256: ${{ inputs.game_archive_sha256 }}
        run: |
          set -euo pipefail
          if [[ -z "$GAME_ARCHIVE_URL" ]]; then
            echo "::error::Set the GAME_ARCHIVE_URL repository secret to an HTTPS ZIP download URL."
            exit 1
          fi
          if [[ "$GAME_ARCHIVE_URL" != https://* ]]; then
            echo "::error::The game archive URL must use HTTPS."
            exit 1
          fi
          if [[ ! "$GAME_ARCHIVE_SHA256" =~ ^[[:xdigit:]]{64}$ ]]; then
            echo "::error::The archive SHA-256 must contain exactly 64 hexadecimal characters."
            exit 1
          fi

          archive="$RUNNER_TEMP/game.zip"
          curl --fail --location --silent --show-error --retry 3 \
            --output "$archive" "$GAME_ARCHIVE_URL"
          printf '%s  %s\n' "$GAME_ARCHIVE_SHA256" "$archive" | shasum --check --algorithm 256

          destination="$RUNNER_TEMP/nxnative-game"
          mkdir -p "$destination"
          python - "$archive" "$destination" <<'PY'
          import sys
          import zipfile
          from pathlib import Path, PurePosixPath

          archive, destination = map(Path, sys.argv[1:])
          root = destination.resolve()
          with zipfile.ZipFile(archive) as package:
              for entry in package.infolist():
                  name = PurePosixPath(entry.filename)
                  if name.is_absolute() or ".." in name.parts:
                      raise SystemExit(f"Unsafe path in game archive: {entry.filename!r}")
                  target = root.joinpath(*name.parts).resolve()
                  if target != root and root not in target.parents:
                      raise SystemExit(f"Unsafe path in game archive: {entry.filename!r}")
              package.extractall(root)

          children = [entry for entry in root.iterdir() if entry.name not in {"__MACOSX", ".DS_Store"}]
          if len(children) == 1 and children[0].is_dir():
              wrapper = children[0]
              for entry in wrapper.iterdir():
                  entry.rename(root / entry.name)
              wrapper.rmdir()
          if not any(root.iterdir()):
              raise SystemExit("The game archive is empty.")
          print("Game archive extracted.")
          PY

      - name: Build IPA
        env:
          PROD_KEYS_BASE64: ${{ secrets.PROD_KEYS_BASE64 }}
        run: |
          set -euo pipefail
          args=(scripts/build_ipa_from_nsp.py "$RUNNER_TEMP/nxnative-game")
          if [[ -n "${PROD_KEYS_BASE64:-}" ]]; then
            keys="$RUNNER_TEMP/prod.keys"
            printf '%s' "$PROD_KEYS_BASE64" | base64 -D > "$keys"
            chmod 600 "$keys"
            args+=(-k "$keys")
          else
            echo "PROD_KEYS_BASE64 is not set; the archive must contain a supported NUP or game dump."
          fi
          python "${args[@]}"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nxnative-unsigned-ipa
          path: ${{ runner.temp }}/nxnative-game/**/*.ipa
          if-no-files-found: error
          retention-days: 7
